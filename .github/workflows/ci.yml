name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: "Guard: skill copies must not drift"
        run: node scripts/sync-skills.mjs --check

      # No API key in CI: the smoke test exercises the offline path
      # (htb_vpn_servers --static) and treats a failing doctor as a warning.
      - name: Smoke-test MCP server over stdio
        run: npm run smoke
